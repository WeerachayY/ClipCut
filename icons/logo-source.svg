<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="85%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#3b0d75" />
      <stop offset="45%" stop-color="#050b38" />
      <stop offset="100%" stop-color="#020314" />
    </radialGradient>

    <!-- Play Triangle Outer Multi-Color Gradient -->
    <linearGradient id="playBorderGrad" x1="0%" y1="0%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="28%" stop-color="#0072ff" />
      <stop offset="55%" stop-color="#d800ff" />
      <stop offset="80%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>

    <!-- Play Triangle Right-Edge Warm Overlay -->
    <linearGradient id="playWarmOverlay" x1="25%" y1="15%" x2="95%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#6875f5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="1" />
    </linearGradient>

    <!-- Progress Bar Rainbow Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="22%" stop-color="#ff6600" />
      <stop offset="42%" stop-color="#ffee00" />
      <stop offset="65%" stop-color="#00ffaa" />
      <stop offset="85%" stop-color="#00ccff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>

    <!-- Soft Drop Shadow for UI Elements -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="38" y="38" width="924" height="924" rx="220" fill="url(#bgGrad)" />

  <!-- Outer Neon Play Button -->
  <g filter="url(#dropShadow)">
    <!-- Base Gradient Triangle -->
    <path d="M 275 170
             A 75 75 0 0 1 388 106
             L 755 320
             A 75 75 0 0 1 755 450
             L 388 664
             A 75 75 0 0 1 275 600
             Z" fill="url(#playBorderGrad)" />

    <!-- Warm Right-Tip Blend -->
    <path d="M 275 170
             A 75 75 0 0 1 388 106
             L 755 320
             A 75 75 0 0 1 755 450
             L 388 664
             A 75 75 0 0 1 275 600
             Z" fill="url(#playWarmOverlay)" />

    <!-- Inner Off-White Play Triangle -->
    <path d="M 316 208
             A 52 52 0 0 1 395 163
             L 712 347
             A 52 52 0 0 1 712 437
             L 395 621
             A 52 52 0 0 1 316 576
             Z" fill="#fbf9f5" />
  </g>

  <!-- Clapperboard Icon -->
  <g fill="#05072e">
    <!-- Top Tilted Clapper Stick -->
    <g transform="translate(348, 305) rotate(-14)">
      <rect x="0" y="0" width="242" height="52" rx="22" />
      <!-- White Clapper Stripes -->
      <polygon points="32,0 68,0 92,52 56,52" fill="#fbf9f5" />
      <polygon points="104,0 140,0 164,52 128,52" fill="#fbf9f5" />
      <polygon points="176,0 212,0 236,52 200,52" fill="#fbf9f5" />
      <!-- Re-mask rounded corners cleanly -->
      <rect x="0" y="0" width="242" height="52" rx="22" fill="none" stroke="#05072e" stroke-width="10" />
    </g>

    <!-- Clapperboard Base Body -->
    <rect x="348" y="344" width="248" height="170" rx="26" />

    <!-- Bottom Clapper Stripes -->
    <polygon points="384,348 420,348 396,386 360,386" fill="#fbf9f5" />
    <polygon points="458,348 494,348 470,386 434,386" fill="#fbf9f5" />
    <polygon points="532,348 568,348 544,386 508,386" fill="#fbf9f5" />

    <!-- Center Play Cutout Inside Clapperboard -->
    <path d="M 430 416
             A 9 9 0 0 1 444 408
             L 502 442
             A 9 9 0 0 1 502 458
             L 444 492
             A 9 9 0 0 1 430 484
             Z" fill="#fbf9f5" />
  </g>

  <!-- Rainbow Progress Bar -->
  <rect x="142" y="676" width="716" height="52" rx="26" fill="url(#barGrad)" filter="url(#dropShadow)" />

  <!-- "ClipCut" Text -->
  <text x="500" y="890" font-family="Google Sans, sans-serif" font-size="165" font-weight="700" letter-spacing="-2" fill="#ffffff" text-anchor="middle">ClipCut</text>
</svg>